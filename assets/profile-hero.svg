<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Michael Berardi — software engineer and studio operator</title>
  <desc id="desc">An editorial midnight profile card with selected local-first software systems.</desc>

  <rect width="1280" height="540" rx="20" fill="#07141b"/>

  <g fill="none" stroke="#79dfd1" stroke-linecap="round">
    <path d="M-80 425C180 310 370 520 650 396S1070 275 1360 400" opacity=".09" stroke-width="54"/>
    <path d="M-60 82C180 4 335 146 565 73S1010 8 1350 108" opacity=".12" stroke-width="2"/>
    <path d="M-20 103C206 31 352 165 580 96S1016 35 1305 122" opacity=".07" stroke-width="1"/>
  </g>


  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">
    <text x="66" y="72" fill="#79dfd1">MICHAEL BERARDI / OPEN SOURCE</text>
    <text x="1214" y="72" fill="#9aa9b0" text-anchor="end">SOFTWARE ENGINEER · SYSTEMS BUILDER</text>
  </g>

  <g fill="#f3f5f2" font-family="Georgia, Times New Roman, serif">
    <text x="66" y="193" font-size="92" letter-spacing="-3">Michael</text>
    <text x="66" y="284" font-size="92" font-style="italic" letter-spacing="-4">Berardi</text>
  </g>

  <line x1="70" y1="324" x2="790" y2="324" stroke="#3a535e"/>
  <g fill="#c9d2d4" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="70" y="369" font-size="27">I build software that stays useful</text>
    <text x="70" y="405" font-size="27">when the demo is over.</text>
  </g>
  <text x="70" y="459" fill="#79dfd1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.5">LOCAL-FIRST TOOLS / AGENT INFRASTRUCTURE / DURABLE WEB</text>

  <g transform="translate(830 104)">
    <rect width="380" height="348" rx="12" fill="#0b2029" stroke="#36525d"/>
    <path d="M1 55H379" stroke="#36525d"/>
    <text x="24" y="34" fill="#79dfd1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">SELECTED SYSTEMS</text>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <g transform="translate(24 91)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">01</text>
        <text x="42" fill="#f3f5f2" font-size="21">Retex</text>
        <text x="42" y="25" fill="#a9bac1" font-size="15">knowledge, kept close</text>
      </g>
      <g transform="translate(24 156)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">02</text>
        <text x="42" fill="#f3f5f2" font-size="21">OverSeer Browser</text>
        <text x="42" y="25" fill="#a9bac1" font-size="15">the browser, under control</text>
      </g>
      <g transform="translate(24 221)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">03</text>
        <text x="42" fill="#f3f5f2" font-size="21">UltraTerm</text>
        <text x="42" y="25" fill="#a9bac1" font-size="15">the desktop, made legible</text>
      </g>
      <g transform="translate(24 286)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">04</text>
        <text x="42" fill="#f3f5f2" font-size="21">UltraVox</text>
        <text x="42" y="25" fill="#a9bac1" font-size="15">voice, kept private</text>
      </g>
    </g>
  </g>

  <text x="1214" y="495" fill="#9aa9b0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" text-anchor="end">SWIFT · RUST · TYPESCRIPT · PYTHON</text>
</svg>
