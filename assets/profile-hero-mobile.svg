<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title desc">
  <title id="title">Michael Berardi — software engineer and studio operator</title>
  <desc id="desc">An editorial midnight profile card with selected local-first software systems.</desc>

  <rect width="600" height="830" rx="20" fill="#07141b"/>
  <g fill="none" stroke="#79dfd1" stroke-linecap="round">
    <path d="M-70 270C92 194 219 338 390 256S607 220 690 288" opacity=".08" stroke-width="42"/>
    <path d="M-30 76C110 22 211 110 351 64S555 41 660 94" opacity=".11" stroke-width="2"/>
  </g>


  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5">
    <text x="48" y="59" fill="#79dfd1">MICHAEL BERARDI / OPEN SOURCE</text>
    <text x="552" y="59" fill="#9aa9b0" text-anchor="end">ENGINEERING</text>
  </g>

  <g fill="#f3f5f2" font-family="Georgia, Times New Roman, serif">
    <text x="46" y="154" font-size="67" letter-spacing="-2">Michael</text>
    <text x="46" y="222" font-size="67" font-style="italic" letter-spacing="-3">Berardi</text>
  </g>

  <line x1="49" y1="255" x2="551" y2="255" stroke="#3a535e"/>
  <g fill="#c9d2d4" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23">
    <text x="49" y="296">I build software that stays useful</text>
    <text x="49" y="327">when the demo is over.</text>
  </g>
  <text x="49" y="365" fill="#79dfd1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">LOCAL-FIRST TOOLS / DURABLE WEB</text>

  <g transform="translate(46 401)">
    <rect width="508" height="350" rx="12" fill="#0b2029" stroke="#36525d"/>
    <path d="M1 54H507" stroke="#36525d"/>
    <text x="22" y="33" fill="#79dfd1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">SELECTED SYSTEMS</text>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <g transform="translate(22 90)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">01</text>
        <text x="40" fill="#f3f5f2" font-size="21">Retex</text>
        <text x="40" y="24" fill="#a9bac1" font-size="16">knowledge, kept close</text>
      </g>
      <g transform="translate(22 155)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">02</text>
        <text x="40" fill="#f3f5f2" font-size="21">OverSeer Browser</text>
        <text x="40" y="24" fill="#a9bac1" font-size="16">the browser, under control</text>
      </g>
      <g transform="translate(22 220)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">03</text>
        <text x="40" fill="#f3f5f2" font-size="21">UltraTerm</text>
        <text x="40" y="24" fill="#a9bac1" font-size="16">the desktop, made legible</text>
      </g>
      <g transform="translate(22 285)">
        <text fill="#8499a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">04</text>
        <text x="40" fill="#f3f5f2" font-size="21">UltraVox</text>
        <text x="40" y="24" fill="#a9bac1" font-size="16">voice, kept private</text>
      </g>
    </g>
  </g>

  <text x="552" y="790" fill="#9aa9b0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" text-anchor="end">SWIFT · RUST · TYPESCRIPT · PYTHON</text>
</svg>
